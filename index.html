<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find a Dealer | Three Roots Animal Nutrition</title>
<meta name="description" content="Find a Three Roots Animal Nutrition dealer by city across Texas.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
<section class="hero">
<p class="eyebrow">Three Roots Animal Nutrition</p>
<h1>Find a Dealer</h1>
<p>Choose a dealer city on the map or from the scrollable city list. Only cities with an active dealer in the directory are shown.</p>
</section>
<section class="layout">
<div class="map-wrap">
<div id="dealer-map" aria-label="Map of dealer cities"></div>
<div class="map-note">City pins represent city centers. Use <strong>Exact Map</strong> on a dealer card for the street address.</div>
</div>
<aside class="city-panel">
<div class="panel-head"><h2>Dealer Cities</h2><button id="show-all" type="button">All</button></div>
<div id="city-buttons" class="city-buttons"></div>
</aside>
</section>
<section class="search-panel">
<label for="dealer-search">Search dealer, city, ZIP or address</label>
<input id="dealer-search" type="search" placeholder="Example: Mission, 78574, El Tigre...">
</section>
<section class="results-section">
<div class="results-head"><h2 id="results-title">All Active Dealers</h2><span id="results-count"></span></div>
<div id="dealer-results" class="dealer-results"></div>
</section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="dealers.js"></script><script src="app.js"></script>
</body></html>
